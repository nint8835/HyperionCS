[project]
name = "hyperioncs"
version = "0.1.0"
description = "SaaS platform for building Discord pseudocurrencies."
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "aiosqlite~=0.22.1",
    "alembic~=1.20.1",
    "authlib~=1.9.8",
    "fastapi~=0.163.1",
    "pydantic~=2.14.3",
    "pydantic-settings~=2.16.3",
    "pyjwt[crypto]~=2.15.1",
    "sqlalchemy[asyncio]~=2.1.9",
    "starlette[full]~=1.10.0",
    "typer~=0.29.1",
    "uvicorn~=0.54.0",
]

[dependency-groups]
dev = ["ruff~=0.17.5"]

[tool.ruff.lint]
select = ["I"]
